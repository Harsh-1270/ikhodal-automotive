spring.application.name=appointment-booking

# ================= DATABASE =================
# Railway MySQL provides: MYSQL_URL, MYSQLHOST, MYSQLPORT, MYSQLUSER, MYSQLPASSWORD, MYSQLDATABASE
spring.datasource.url=jdbc:mysql://localhost:3306/appointment_booking?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================= JPA / HIBERNATE =================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ================= CONNECTION POOL =================
spring.datasource.hikari.maximum-pool-size=10

# ================= SERVER =================
# Railway uses the PORT env var
server.port=8082

# ================= JWT =================
jwt.secret=MySuperSecretKeyForJwtGeneration123456
jwt.expiration=3600000
jwt.refresh.expiration=604800000

# ================= LOGGING =================
logging.level.org.springframework.security=INFO


# ================= RESEND EMAIL CONFIG =================
resend.api-key=re_fdJ1bBR2_DAAPUmqZ6jtrfzG2buqNnBck
resend.from-email=noreply@ikhodalautomotive.com
resend.admin-email=info@ikhodalautomotive.com


